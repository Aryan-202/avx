name: Build and Release Executables

on:
  push:
    tags:
      - 'v*' # Trigger this workflow when a tag like v1.0.0 is pushed

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            executable_name: avx-windows-amd64.exe
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            executable_name: avx-linux-amd64
          - os: darwin
            arch: amd64
            runner: macos-13
            executable_name: avx-darwin-amd64
          - os: darwin
            arch: arm64
            runner: macos-latest
            executable_name: avx-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          uv run pyinstaller --onefile --name ${{ matrix.executable_name }} avx/cli.py
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.executable_name }}
          path: dist/${{ matrix.executable_name }}

  release:
    name: Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
